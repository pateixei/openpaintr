[package]
name = "openpaintr"
version = "0.1.0"
edition = "2024"
publish = false
description = "Editor raster em Rust para Linux"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:winit", "dep:rfd", "dep:tempfile", "dep:arboard", "dep:serde", "dep:serde_json", "dep:arabic_reshaper", "dep:unicode-bidi", "dep:wayland-client", "dep:image", "dep:url"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
arboard = { version = "3.7", features = ["wayland-data-control"], optional = true }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
winit = { version = "0.30", default-features = false, features = ["wayland", "x11"], optional = true }
rfd = { version = "0.15.4", optional = true }
tempfile = { version = "3", optional = true }
png = "0.18.1"
# Zero-copy views between pixels and bytes.
bytemuck = { version = "1.25", features = ["derive", "extern_crate_alloc"] }
jflib-gfx = "0.2.1"
jflib-img-core = "0.2.1"
jflib-img-pdn = "0.2.1"
# Use the host standard library for JFLib's runtime.
jflib-plat = { version = "0.2.1", features = ["std"] }
jflib-rt = "0.2.1"
arabic_reshaper = { version = "0.4.2", optional = true }
unicode-bidi = { version = "0.3.18", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31.15", features = ["system"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"], optional = true }
url = { version = "2.5", optional = true }
